spring:
  application:
    name: fitcontrol
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration/public
  mail:
    host: ${SMTP_HOST:?Must set SMTP_HOST env var}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:?Must set SMTP_USERNAME env var}
    password: ${SMTP_PASSWORD:?Must set SMTP_PASSWORD env var}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        from: ${SMTP_FROM:?Must set SMTP_FROM env var}
    default-encoding: utf-8
  messages:
    basename: messages/messages
app:
  jwt:
    secret: ${JWT_SECRET:?Must set JWT_SECRET env var}
    expiration_ms: ${JWT_EXPIRATION_MS:900000}
    issuer: ${JWT_ISSUER:api}
  refresh_token:
    expiration_minutes: ${REFRESH_TOKEN_EXPIRATION_MINUTES:10080}
  migration:
    tenant-location: ${MIGRATION_TENANT_LOCATION:classpath:db/migration/tenant}
  infra:
    frontend-url: ${FRONTEND_URL:?Must set FRONTEND_URL env var}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fitcontrol}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    properties:
      mail:
        debug: true

---
spring:
  config:
    activate:
      on-profile: prod
  web:
    error:
      include-stacktrace: never
      include-message: never
      include-binding-errors: never
  datasource:
    url: jdbc:postgresql://${DB_HOST:?Must set DB_HOST env var}:${DB_PORT:?Must set DB_PORT env var}/${DB_NAME:?Must set DB_NAME env var}
    username: ${DB_USERNAME:?Must set DB_USERNAME env var}
    password: ${DB_PASSWORD:?Must set DB_PASSWORD env var}
  data:
    redis:
      host: ${REDIS_HOST:?Must set REDIS_HOST env var}
      port: ${REDIS_PORT:?Must set REDIS_PORT env var}
      password: ${REDIS_PASSWORD:?Must set REDIS_PASSWORD env var}